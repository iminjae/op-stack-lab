services:

  op-reth:
    command:
      - node
      - --chain=/config/genesis.json
      - --datadir=/data
      - --db.max-size=256GB
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,debug,txpool
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/run/secrets/jwt.hex
      - --rollup.disable-tx-pool-gossip
      - --metrics
      - 0.0.0.0:9001
    ports:
      - "192.168.45.10:9001:9001"

  op-node:
    environment:
      OP_NODE_METRICS_ENABLED: "true"
      OP_NODE_METRICS_ADDR: "0.0.0.0"
      OP_NODE_METRICS_PORT: "7300"
      OP_NODE_P2P_DISABLE: "false"
      OP_NODE_P2P_LISTEN_IP: "0.0.0.0"
      OP_NODE_P2P_LISTEN_TCP_PORT: "9222"
      OP_NODE_P2P_LISTEN_UDP_PORT: "9222"
      OP_NODE_P2P_NO_DISCOVERY: "true"
      OP_NODE_P2P_PRIV_PATH: "/p2p/priv.txt"
      OP_NODE_P2P_PEERSTORE_PATH: "/p2p/peerstore"
      OP_NODE_P2P_STATIC: "/ip4/192.168.45.11/tcp/9222/p2p/16Uiu2HAmRPwFYru2nn8c1qfxZqJPJ26H8oZBzFgA9neKY6FNAsXT"
    volumes:
      - /opt/opstack/data/op-node-p2p:/p2p

    ports:
      - "192.168.45.10:7300:7300"

  op-challenger:
    environment:
      OP_CHALLENGER_METRICS_ENABLED: "true"
      OP_CHALLENGER_METRICS_ADDR: "0.0.0.0"
      OP_CHALLENGER_METRICS_PORT: "7303"
    ports:
      - "192.168.45.10:7303:7303"
